<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1" />

  <title>Flatiron Task Lister</title>

  <link rel="stylesheet"
    href="./style.css">
</head>

<body>
  <h1 class="text-center">Task Lister Lite™️</h1>
  <div id="main-content">


    <div id="form-container">
      <form id="create-task-form"
        action=""
        method="POST">
        <label for="task-user">Assigned User:</label>
        <input type="text"
          id="task-user"
          name="task-user"
          placeholder="user"
          required>

        <label for="new-task-description">Task description:</label>


        <select id="task-priority"
          name="task-priority">
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <input type="text"
          id="new_todo"
          name="new-task-description"
          placeholder="description"
          required>
        <input type="submit"
          value="Create New Task">

      </form>
    </div>



    <div id="list-container">
      <h2>My todos <button id="sort-button">Sort items <span id="arrows">⇅</span></button></h2>
      </br>

      <div id="list">
        <ul id="tasks">
        </ul>

      </div>
    </div>
    <dialog id="editBox">
      <input type="text"
        id="taskEdit"
        name="task-user"
        required>
      <button id="closeModal"
        class="update-button">
        Update

      </button>

    </dialog>

  </div>
  <script src="./src/index.js"></script>

</body>

</html>
